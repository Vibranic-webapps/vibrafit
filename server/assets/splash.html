<!-- Loading splash. Strings in {{...}} come from i18n/locales/en.json (splash.*), filled in by server/plugins/splash.ts.
     Lives OUTSIDE #__nuxt so hydration never touches it. Colours are deliberately theme-independent:
     the videos have a flat #F5F0E1 background and a dark outline, so the splash stays light in dark mode too. -->
<div id="vbs" role="status" aria-live="polite" data-slow="{{wakingUp}}">
<style>
#vbs{--bg:#F5F0E1;--ink:#17201C;--signal:#FF6A33;position:fixed;inset:0;z-index:2147483000;background:var(--bg);color:var(--ink);display:flex;align-items:center;justify-content:center;opacity:1;transition:opacity .24s linear}
#vbs[hidden]{display:none}
#vbs.out{opacity:0;pointer-events:none}
#vbs .c{display:flex;flex-direction:column;align-items:center;gap:16px;padding:16px;opacity:0;animation:vbs-in .2s linear .15s forwards}
#vbs .box{position:relative;width:min(78vw,360px);aspect-ratio:1;-webkit-mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);-webkit-mask-composite:source-in;mask-image:linear-gradient(to right,transparent,#000 12%,#000 88%,transparent),linear-gradient(to bottom,transparent,#000 12%,#000 88%,transparent);mask-composite:intersect}
#vbs video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:var(--bg);pointer-events:none}
#vbs .rest{opacity:0;transition:opacity .3s linear}
#vbs.slow .rest{opacity:1}
#vbs .name{margin:0;font:800 clamp(28px,9vw,40px)/1 'Barlow Condensed','Arial Narrow','Roboto Condensed',system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding-bottom:6px;border-bottom:1px solid var(--signal)}
#vbs .msg{margin:0;font:500 16px/1.4 system-ui,-apple-system,'Segoe UI',sans-serif;color:#4A524E;text-align:center}
#vbs button{min-height:44px;min-width:44px;padding:0 24px;font:600 16px system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:transparent;border:1px solid var(--ink);border-radius:8px;cursor:pointer}
#vbs button:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
#vbs button[hidden]{display:none}
#vbs .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
@keyframes vbs-in{to{opacity:1}}
@media (prefers-reduced-motion:reduce){#vbs,#vbs .rest{transition:none}#vbs .c{animation-duration:0s}}
</style>
<div class="c">
<span class="sr">{{sr}}</span>
<div class="box" aria-hidden="true">
<video class="lift" muted playsinline loop preload="auto" poster="/splash/lift-poster.jpg"></video>
<video class="rest" muted playsinline loop preload="none"></video>
</div>
<p class="name" aria-hidden="true">VIBRAFIT</p>
<p class="msg">{{chalkUp}}</p>
<button type="button" hidden>{{retry}}</button>
</div>
<noscript><style>#vbs{display:none}</style></noscript>
<script>
(function(){
var d=document,w=window,t0=performance.now(),root=d.getElementById('vbs'),c=root.querySelector('.c'),
lift=root.querySelector('.lift'),rest=root.querySelector('.rest'),msg=root.querySelector('.msg'),btn=root.querySelector('button'),
reduce=w.matchMedia&&w.matchMedia('(prefers-reduced-motion:reduce)').matches,timers=[],finished=false,
SHOW=150,MIN=600,FADE=240;
function later(fn,ms){timers.push(setTimeout(fn,ms))}
function stop(v){try{v.pause()}catch(e){}v.removeAttribute('src');v.load()}
// Reduced motion: the poster stays as a static picture, no video is requested.
if(!reduce){
 lift.src='/splash/lift.mp4';
 var p=lift.play();if(p&&p.catch)p.catch(function(){}); // autoplay may be blocked: the poster just stays
}
// 4 s: slow state. rest.mp4 is only requested here.
later(function(){
 msg.textContent=root.getAttribute('data-slow');
 if(reduce)return;
 rest.poster="/splash/rest-poster.jpg";rest.src="/splash/rest.mp4";
 var p=rest.play();if(p&&p.catch)p.catch(function(){});
 root.classList.add('slow');
 later(function(){try{lift.pause()}catch(e){}},300);
},4000);
// 8 s: Retry becomes visible (and focusable).
later(function(){btn.hidden=false},8000);
btn.addEventListener('click',function(){location.reload()});
w.__vbs={readyAt:null,done:function(){
 if(finished)return;finished=true;
 w.__vbs.readyAt=Math.round(performance.now());
 // Contents become visible at SHOW ms; keep them for at least MIN ms.
 var elapsed=performance.now()-t0;
 function clear(){timers.forEach(clearTimeout);stop(lift);stop(rest);root.hidden=true;while(c.firstChild)c.removeChild(c.firstChild)}
 // Loaded before the contents ever showed: remove at once, nothing fades in half-way.
 if(elapsed<SHOW){clear();return}
 // Contents are visible: keep them for at least MIN ms, then fade out.
 later(function(){
  root.classList.add('out');
  later(clear,FADE+20);
 },Math.max(0,SHOW+MIN-elapsed));
}};
})();
</script>
</div>
